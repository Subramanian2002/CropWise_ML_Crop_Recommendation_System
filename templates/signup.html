{% extends "base.html" %}
{% block title %}Sign Up | CropWise{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card auth-card p-4 shadow" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="mb-2">🌿 Join CropWise</h3>
                <p class="text-muted">Create your account to start receiving smart crop recommendations.</p>
            </div>

            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="yourname@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="********" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success btn-lg">Sign Up</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">
                    Already have an account?
                    <a href="{{ url_for('login') }}" style="color: var(--primary-color);">Login</a>
                </p>
                <a href="{{ url_for('home') }}" class="text-decoration-none">← Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
